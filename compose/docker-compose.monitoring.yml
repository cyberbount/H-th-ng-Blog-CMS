services:
  # 1. cAdvisor - Giám sát container (Theo tài liệu ICTU)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: blog-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitor_net

  # 1b. Docker Stats Exporter - Cung cấp metrics chuẩn 100% cho Docker trên Windows/WSL2
  docker-stats-exporter:
    image: wywywywy/docker_stats_exporter:latest
    container_name: blog-docker-stats-exporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitor_net

  # 2. Node Exporter - Giám sát OS/Server (Dashboard 1860)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: blog-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - monitor_net

  # 3. mysqld-exporter - Giám sát MySQL (Dashboard 7362)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: blog-mysqld-exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/.my.cnf
    volumes:
      - ../monitoring/mysqld-exporter/.my.cnf:/etc/.my.cnf:ro
    depends_on:
      - mysql
    networks:
      - backend_net
      - monitor_net

  # 4. nginx-prometheus-exporter - Giám sát Nginx (Dashboard 12740)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: blog-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://npm:8082/stub_status
    depends_on:
      - npm
    networks:
      - monitor_net

  # 4. Prometheus Server
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: blog-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitor_net

  # 5. Grafana Dashboard
  grafana:
    image: grafana/grafana:10.4.0
    container_name: blog-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=GrafanaAdminSecurePass2026!
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitor_net


