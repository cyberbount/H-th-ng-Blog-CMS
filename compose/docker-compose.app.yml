services:
  # 1. Database MySQL (Port 3308)
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: SuperRootSecurePass2026!
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: WP_SecurePassword2026!
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net

  # 2. WordPress Blog (Port 8080)
  wordpress:
    image: wordpress:6-php8.2-apache
    container_name: blog-wordpress
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mysql
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress_db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: WP_SecurePassword2026!
      WORDPRESS_TABLE_PREFIX: wp_
    ports:
      - "8080:80"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - frontend_net
      - backend_net

  # 3. phpMyAdmin (Port 8081)
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: blog-phpmyadmin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mysql
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - frontend_net
      - backend_net

  # 4. Nginx Proxy Manager (Cổng Web UI 81, HTTP 80, HTTPS 443)
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: blog-npm
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
      - ../nginx/npm-default-fallback.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - wordpress
      - phpmyadmin
    networks:
      - frontend_net
      - monitor_net


