include:
  - compose/docker-compose.app.yml
  - compose/docker-compose.monitoring.yml
  - compose/docker-compose.logging.yml

networks:
  frontend_net:
    name: blog_frontend_net
    driver: bridge
  backend_net:
    name: blog_backend_net
    driver: bridge
  monitor_net:
    name: blog_monitor_net
    driver: bridge
  logging_net:
    name: blog_logging_net
    driver: bridge

volumes:
  mysql_data:
  wordpress_data:
  npm_data:
  npm_letsencrypt:
  prometheus_data:
  grafana_data:
  loki_data:
