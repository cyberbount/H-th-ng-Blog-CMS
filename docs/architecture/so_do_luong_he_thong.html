<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ đồ Luồng Hệ thống Tổng quan — LyxLab Blog CMS (ICTU K23A)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .header {
      width: 100%;
      max-width: 1920px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .header h1 { font-size: 1.25rem; font-weight: 800; color: #60a5fa; }
    .header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    .badge {
      background: #1e3a8a;
      color: #93c5fd;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid #3b82f6;
    }
    .img-container {
      width: 100%;
      max-width: 1920px;
      background: #ffffff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      overflow-x: auto;
    }
    .img-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { background: var(--surface); }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Sơ đồ Luồng Điều Phối &amp; Dữ liệu Hệ thống Tổng quan (End-to-End System Flow)</h1>
      <p>Hệ thống Blog CMS LyxLab — Đề tài 7 | Triển khai &amp; Quản trị Hệ thống Phần mềm (ICTU K23A)</p>
    </div>
    <div class="actions">
      <span class="badge">13 Containers • 4 Networks • 3 Data Paths</span>
      <a class="btn" href="so_do_luong_he_thong_tong_quan.png" download>Tải ảnh PNG (Gốc)</a>
      <a class="btn btn-outline" href="so_do_luong_he_thong_tong_quan.svg" target="_blank">Xem Vector SVG</a>
    </div>
  </div>

  <div class="img-container">
    <img src="so_do_luong_he_thong_tong_quan.png" alt="Sơ đồ luồng hệ thống tổng quan LyxLab Blog CMS" />
  </div>
</body>
</html>
