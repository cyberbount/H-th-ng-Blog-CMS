# ------------------------------------------------------------
# NPM built-in fallback (patched for this project)
#
# The stock /etc/nginx/conf.d/default.conf of jc21/nginx-proxy-manager
# ships a 443 server block with `server_name localhost` +
# `ssl_reject_handshake on`. Because it is included BEFORE
# /data/nginx/proxy_host/*.conf, it captures the SNI "localhost" and
# kills the TLS handshake of our LyxLab proxy host (same server_name).
#
# This patched copy keeps only the port-80 "not configured" fallback
# and drops the 443 reject block, letting proxy_host/1.conf own 443.
# Mounted read-only by compose/docker-compose.app.yml.
# ------------------------------------------------------------
server {
	listen 80;
	listen [::]:80;

	set $forward_scheme "http";
	set $server "127.0.0.1";
	set $port "80";

	server_name localhost-nginx-proxy-manager;
	access_log /data/logs/fallback_http_access.log standard;
	error_log /data/logs/fallback_http_error.log warn;
	include conf.d/include/assets.conf;
	include conf.d/include/block-exploits.conf;
	include conf.d/include/letsencrypt-acme-challenge.conf;

	location / {
		index index.html;
		root /var/www/html;
	}
}
