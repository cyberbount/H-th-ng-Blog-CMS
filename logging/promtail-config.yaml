server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Scrape Docker container stdout/stderr logs directly from docker socket
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

  # 2. Scrape Nginx Proxy Manager Access & Error log files
  - job_name: nginx-proxy-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: nginx-proxy
          __path__: /data/logs/*_*.log

